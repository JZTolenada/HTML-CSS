<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Qora</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width= device-width, initial-scale= 1.0">
        <link rel="stylesheet" href="nav.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="footer.css">
        <link rel="stylesheet" href="products.css">
        <link rel="shortcut icon" href="q.svg" type="image/x-icon">

    </head>

    <body>

        <nav>
            <a href="index.html" class="brand"><h1><span class="letterQ">Q</span>ora</h1></a>

            <ul>
                <li><a href="index.html" class="navlink">Home</a></li>
                <li><a href="#" class="navlink active">Products</a></li>
                <li><a href="about.html" class="navlink">About</a></li>
            </ul>

            <a href="#" id="cart" onclick="openCart(); return false;">
                <img src="cart.svg" alt="cart">
            </a>
        </nav>

    <main>
            <div class="products-header">
                <h1>Our Products</h1>
                <p>Find something you'll love.</p>
            </div>

            <div class="product-grid">

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/pencil case.png" alt="Pencil Case">
                    </div>

                    <div class="product-info">
                        <h2>Pencil Case</h2>
                        <p>₱99</p>
                        <button onclick="addToCart('Pencil Case', 99)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/table fan.png" alt="Table Fan">
                    </div>

                    <div class="product-info">
                        <h2>Table Fan</h2>
                        <p>₱399</p>
                        <button onclick="addToCart('Table Fan', 399)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/tote-bag.png" alt="Tote Bag">
                    </div>

                    <div class="product-info">
                        <h2>Tote Bag</h2>
                        <p>₱199</p>
                        <button onclick="addToCart('Tote Bag', 199)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/calculator.png" alt="Calculator">
                    </div>

                    <div class="product-info">
                        <h2>Calculator</h2>
                        <p>₱899</p>
                        <button onclick="addToCart('Calculator', 899)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/desk-lamp.png" alt="Desk Lamp">
                    </div>

                    <div class="product-info">
                        <h2>Desk Lamp</h2>
                        <p>₱949</p>
                        <button onclick="addToCart('Desk Lamp', 949)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/lunch-box.png" alt="Lunch Box">
                    </div>

                    <div class="product-info">
                        <h2>Lunch Box</h2>
                        <p>₱300</p>
                        <button onclick="addToCart('Lunch Box', 300)">Add to Cart</button>
                    </div>
                </div>
            </div>

        <div class="pagination">
            <a href="products.html">1</a>
            <a href="products-2.html">2</a>
            <a href="#" class="active-page">3</a>
        </div>

    </main>

        <footer>
            <p>@2026 Qora. All Rights Reserved.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
