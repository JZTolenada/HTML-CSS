<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Qora</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width= device-width, initial-scale= 1.0">
        <link rel="stylesheet" href="nav.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="footer.css">
        <link rel="stylesheet" href="products.css">
        <link rel="shortcut icon" href="q.svg" type="image/x-icon">

    </head>

    <body>

        <nav>
            <a href="index.html" class="brand"><h1><span class="letterQ">Q</span>ora</h1></a>

            <ul>
                <li><a href="index.html" class="navlink">Home</a></li>
                <li><a href="#" class="navlink active">Products</a></li>
                <li><a href="about.html" class="navlink">About</a></li>
            </ul>

            <a href="#" id="cart" onclick="openCart(); return false;">
                <img src="cart.svg" alt="cart">
            </a>
        </nav>

    <main>
            <div class="products-header">
                <h1>Our Products</h1>
                <p>Find something you'll love.</p>
            </div>

            <div class="product-grid">

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/backpack.png" alt="Backpack">
                    </div>

                    <div class="product-info">
                        <h2>Backpack</h2>
                        <p>₱999</p>
                        <button onclick="addToCart('Backpack', 999)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/tumbler.png" alt="Tumbler">
                    </div>

                    <div class="product-info">
                        <h2>Tumbler</h2>
                        <p>₱199</p>
                        <button onclick="addToCart('Tumbler', 199)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/wall-clock.png" alt="Wall Clock">
                    </div>

                    <div class="product-info">
                        <h2>Wall Clock</h2>
                        <p>₱499</p>
                        <button onclick="addToCart('Wall Clock', 499)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/wallet.png" alt="Wallet">
                    </div>

                    <div class="product-info">
                        <h2>Wallet</h2>
                        <p>₱349</p>
                        <button onclick="addToCart('Wallet', 349)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/watch.png" alt="Watch">
                    </div>

                    <div class="product-info">
                        <h2>Watch</h2>
                        <p>₱3,999</p>
                        <button onclick="addToCart('Watch', 3999)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/earbuds.png" alt="Earbuds">
                    </div>

                    <div class="product-info">
                        <h2>Earbuds</h2>
                        <p>₱1,499</p>
                        <button onclick="addToCart('Earbuds', 1499)">Add to Cart</button>
                    </div>
                </div>
            </div>

        <div class="pagination">
            <a href="products.html">1</a>
            <a href="#" class="active-page">2</a>
            <a href="products-3.html">3</a>
        </div>

    </main>

        <footer>
            <p>@2026 Qora. All Rights Reserved.</p>
