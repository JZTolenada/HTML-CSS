<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Qora</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width= device-width, initial-scale= 1.0">
        <link rel="stylesheet" href="nav.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="footer.css">
        <link rel="stylesheet" href="products.css">
        <link rel="shortcut icon" href="q.svg" type="image/x-icon">

    </head>

    <body>

        <nav>
            <a href="index.html" class="brand"><h1><span class="letterQ">Q</span>ora</h1></a>

            <ul>
                <li><a href="index.html" class="navlink">Home</a></li>
                <li><a href="#" class="navlink active">Products</a></li>
                <li><a href="about.html" class="navlink">About</a></li>
            </ul>

            <a href="#" id="cart" onclick="openCart(); return false;">
                <img src="cart.svg" alt="cart">
            </a>
        </nav>

    <main>
            <div class="products-header">
                <h1>Our Products</h1>
                <p>Find something you'll love.</p>
            </div>

            <div class="product-grid">

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/keyboard.png" alt="Wireless Keyboard">
                    </div>

                    <div class="product-info">
                        <h2>Wireless Keyboard</h2>
                        <p>₱1,799</p>
                        <button onclick="addToCart('Wireless Keyboard', 1799)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/mouse.png" alt="Wireless Mouse">
                    </div>

                    <div class="product-info">
                        <h2>Wireless Mouse</h2>
                        <p>₱599</p>
                        <button onclick="addToCart('Wireless Mouse', 599)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/headphone.png" alt="Headphone">
                    </div>

                    <div class="product-info">
                        <h2>Headphone</h2>
                        <p>₱799</p>
                        <button onclick="addToCart('Headphone', 799)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/webcam.png" alt="Webcam">
                    </div>

                    <div class="product-info">
                        <h2>Webcam</h2>
                        <p>₱499</p>
                        <button onclick="addToCart('Webcam', 499)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/speaker.png" alt="Speaker">
                    </div>

                    <div class="product-info">
                        <h2>Bluetooth Speaker</h2>
                        <p>₱1,500</p>
                        <button onclick="addToCart('Bluetooth Speaker', 1500)">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="products/powerbank.png" alt="Powerbank">
                    </div>

                    <div class="product-info">
                        <h2>Powerbank</h2>
                        <p>₱1,199</p>
                        <button onclick="addToCart('Powerbank', 1199)">Add to Cart</button>
                    </div>
                </div>
            </div>

        <div class="pagination">
            <a href="#" class="active-page">1</a>
            <a href="products-2.html">2</a>
            <a href="products-3.html">3</a>
        </div>

    </main>

        <!-- Cart Modal -->
        <div id="cartModal" class="cart-modal">
            <div class="cart-panel">
                <div class="cart-header">
                    <h2>Shopping Cart</h2>
                    <button class="close-cart" onclick="closeCart()">✕</button>
                </div>
                <div id="cartList" class="cart-items">
                    <p>Cart is empty</p>
                </div>
                <div class="cart-footer">
                    <div class="cart-total">
                        Total: ₱<span id="total">0</span>
                    </div>
                    <button class="checkout-btn" onclick="checkoutCart()">Checkout</button>
                </div>
            </div>
        </div>

        <footer>
            <p>@2026 Qora. All Rights Reserved.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
